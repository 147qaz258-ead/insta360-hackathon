<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>review-loading</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f1f2ef;
      color: #23282a;
      overflow: hidden;
    }
    .review-shell {
      display: grid;
      grid-template-columns: 520px 1fr;
      gap: 14px;
      width: 100vw;
      height: 100vh;
      padding: 14px;
    }
    .side-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    .panel {
      background: #ffffff;
      border: 1px solid #d8dcd8;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2 {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #5a6265;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .original-wrap { flex: 0 0 auto; }
    .original-stage {
      width: 100%;
      height: 330px;
      background: #101313;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .original-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .aux-wrap { flex: 0 0 auto; }
    .aux-stage { width: 100%; height: 300px; border-radius: 6px; overflow: hidden; }
    .metrics-wrap { flex: 1 1 auto; overflow: hidden; }
    .metrics-list { font-size: 12.5px; line-height: 1.75; overflow: auto; }
    .metrics-list dt { float: left; clear: left; width: 46%; color: #5a6265; }
    .metrics-list dd { margin-left: 48%; font-variant-numeric: tabular-nums; word-break: break-all; }
    .main-col { display: flex; flex-direction: column; min-height: 0; }
    .main-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 10px;
    }
    .main-head h1 { font-size: 17px; }
    .main-head span { font-size: 12.5px; color: #5a6265; }
    .main-stage { flex: 1 1 auto; min-height: 0; border-radius: 10px; overflow: hidden; background: #f1f2ef; }
    .blind-shell { width: 100vw; height: 100vh; padding: 10px; }
    .blind-stage { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; }
    .load-error { padding: 40px; font-size: 15px; color: #a33; }
  </style>
</head>
<body>
  <main id="fullShell" class="review-shell" hidden>
    <div class="side-col">
      <section class="panel original-wrap">
        <h2>原始图片 · 等比完整</h2>
        <div class="original-stage"><img id="originalImage" alt="原始图片" /></div>
      </section>
      <section class="panel aux-wrap">
        <h2>2.5D 高度辅图 · 固定角度</h2>
        <div id="auxSurface" class="aux-stage"></div>
      </section>
      <section class="panel metrics-wrap">
        <h2>机械指标</h2>
        <dl id="metricsList" class="metrics-list"></dl>
      </section>
    </div>
    <div class="main-col">
      <div class="main-head">
        <h1>候选主点阵 · 严格俯视 · 白色升起 / 黑色落下</h1>
        <span id="candidateLabel">—</span>
      </div>
      <div id="mainSurface" class="main-stage"></div>
    </div>
  </main>
  <main id="blindShell" class="blind-shell" hidden>
    <div id="blindSurface" class="blind-stage"></div>
  </main>
  <script type="module" src="/review.js"></script>
</body>
</html>
