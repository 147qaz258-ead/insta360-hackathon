<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Insta360 Link 2 控制台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: #111821;
      --panel-2: #17212c;
      --line: #273544;
      --text: #edf5fc;
      --muted: #8fa3b5;
      --cyan: #58e1ff;
      --green: #5cf2ad;
      --danger: #ff6b7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(36, 140, 168, .22), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(31, 113, 78, .16), transparent 30%),
        var(--bg);
    }
    .shell { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 44px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); letter-spacing: -.04em; }
    h1 span { color: var(--cyan); }
    .badge { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 14px currentColor; }
    .dot.online { background: var(--green); }
    main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .75fr); gap: 18px; }
    .card { border: 1px solid var(--line); background: rgba(17, 24, 33, .88); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.24); }
    .preview { position: relative; overflow: hidden; min-height: 540px; background: #020305; }
    video { width: 100%; height: 100%; min-height: 540px; object-fit: contain; display: block; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
    .toolbar { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; padding: 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: rgba(3, 8, 13, .78); backdrop-filter: blur(16px); }
    select, button, input { font: inherit; }
    select { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 10px; background: #0d141c; color: var(--text); padding: 10px 12px; }
    button { border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2); color: var(--text); padding: 10px 14px; cursor: pointer; transition: .16s ease; }
    button:hover { border-color: var(--cyan); transform: translateY(-1px); }
    button:active, button.active { transform: translateY(1px); background: #1d3944; }
    button.primary { background: var(--cyan); color: #061014; border-color: transparent; font-weight: 700; }
    button.danger { color: #ffc8cf; }
    aside { display: grid; gap: 18px; align-content: start; }
    .section { padding: 18px; }
    .section h2 { margin: 0 0 14px; font-size: 16px; }
    .dpad { width: 220px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 62px); gap: 8px; }
    .dpad button { font-size: 22px; padding: 0; touch-action: none; user-select: none; }
    .up { grid-column: 2; }
    .left { grid-row: 2; grid-column: 1; }
    .home { grid-row: 2; grid-column: 2; font-size: 14px !important; }
    .right { grid-row: 2; grid-column: 3; }
    .down { grid-row: 3; grid-column: 2; }
    .speed { display: grid; grid-template-columns: 48px 1fr 28px; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 13px; }
    input[type=range] { width: 100%; accent-color: var(--cyan); }
    .stack { display: grid; gap: 9px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .status { font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.6; color: var(--muted); white-space: pre-wrap; word-break: break-word; margin: 0; }
    #toast { position: fixed; right: 22px; bottom: 22px; max-width: 420px; padding: 12px 16px; border-radius: 12px; background: #16232d; border: 1px solid var(--line); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { border-color: var(--danger); color: #ffc4cb; }
    canvas { display: none; }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      .preview, video { min-height: 52vw; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Link 2 <span>现场控制台</span></h1>
        <div class="badge"><span id="dot" class="dot"></span><span id="deviceStatus">正在检查 SDK…</span></div>
      </div>
      <button onclick="reconnectSdk()">重新连接 SDK</button>
    </header>

    <main>
      <section class="card preview">
        <video id="video" autoplay playsinline muted></video>
        <div id="empty" class="empty">点击“打开画面”，并允许浏览器使用摄像头</div>
        <div class="toolbar">
          <select id="cameraSelect"><option>尚未授权摄像头</option></select>
          <button class="primary" onclick="openVideo()">打开画面</button>
          <button onclick="snapshot()">截图</button>
          <button class="danger" onclick="closeVideo()">关闭</button>
        </div>
      </section>

      <aside>
        <section class="card section">
          <h2>云台控制</h2>
          <div class="dpad">
            <button class="up" data-direction="up" aria-label="向上">↑</button>
            <button class="left" data-direction="left" aria-label="向左">←</button>
            <button class="home" onclick="recoverDownwardPose()">复位</button>
            <button class="right" data-direction="right" aria-label="向右">→</button>
            <button class="down" data-direction="down" aria-label="向下">↓</button>
          </div>
          <label class="speed">
            <span>速度</span>
            <input id="speed" type="range" min="1" max="10" value="3">
            <strong id="speedValue">3</strong>
          </label>
        </section>

        <section class="card section stack">
          <h2>机内 AI 算法</h2>
          <div class="two">
            <button onclick="setTracking(true)">开启跟踪</button>
            <button onclick="setTracking(false)">关闭跟踪</button>
          </div>
          <button class="primary" onclick="recoverDownwardPose()">修复镜头一直朝下</button>
          <div class="two">
            <button onclick="setAutoFraming(true)">自动构图</button>
            <button onclick="setAutoFraming(false)">普通模式</button>
          </div>
        </section>

        <section class="card section">
          <h2>设备状态</h2>
          <pre id="status" class="status">等待状态…</pre>
        </section>
      </aside>
    </main>
  </div>

  <canvas id="canvas"></canvas>
  <div id="toast"></div>

  <script>
    const video = document.getElementById('video');
    const cameraSelect = document.getElementById('cameraSelect');
    const empty = document.getElementById('empty');
    const toast = document.getElementById('toast');
    let stream;
    let toastTimer;

    function notify(message, error = false) {
      toast.textContent = message;
      toast.className = `show${error ? ' error' : ''}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.className = '', 3200);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, { cache: 'no-store', ...options });
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || 'SDK 命令失败');
      if (data.message) notify(data.message);
      return data;
    }

    async function loadCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter(device => device.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      for (const camera of cameras) {
        const option = document.createElement('option');
        option.value = camera.deviceId;
        option.textContent = camera.label || `摄像头 ${cameraSelect.length + 1}`;
        if (/Insta360 Link 2/i.test(camera.label)) option.selected = true;
        cameraSelect.appendChild(option);
      }
    }

    async function openVideo() {
      try {
        closeVideo();
        // Let the native service create its SDK controller before the browser
        // opens the UVC stream. This improves coexistence on Windows.
        try { await api('/api/status'); } catch (_) { /* Video capture can still work independently. */ }
        const permission = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        permission.getTracks().forEach(track => track.stop());
        await loadCameras();
        const constraints = {
          video: {
            deviceId: cameraSelect.value ? { exact: cameraSelect.value } : undefined,
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        empty.hidden = true;
        notify('Link 2 画面已打开');
      } catch (error) {
        notify(`打开画面失败：${error.message}`, true);
      }
    }

    function closeVideo() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = undefined;
      video.srcObject = null;
      empty.hidden = false;
    }

    function snapshot() {
      if (!video.videoWidth) return notify('请先打开摄像头画面', true);
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const link = document.createElement('a');
      link.download = `link2-${new Date().toISOString().replaceAll(':', '-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function refreshStatus() {
      try {
        const data = await api('/api/status');
        document.getElementById('dot').classList.add('online');
        document.getElementById('deviceStatus').textContent = data.name || 'Link 设备在线';
        document.getElementById('status').textContent = [
          `型号: ${data.name || '-'}`,
          `序列号: ${data.serial || '-'}`,
          `AI: ${data.ai ? '开启' : '关闭'}`,
          `隐私模式: ${data.privacy ? '开启（镜头会朝下）' : '关闭'}`,
          `跟踪: ${data.tracking ? '开启' : '关闭'}`,
          `单击跟踪: ${data.singleTapTracking ? '开启' : '关闭'}`,
          data.panDegrees === undefined ? '' : `云台: Pan ${data.panDegrees.toFixed(1)}° / Tilt ${data.tiltDegrees.toFixed(1)}°`
        ].filter(Boolean).join('\n');
      } catch (error) {
        document.getElementById('dot').classList.remove('online');
        document.getElementById('deviceStatus').textContent = 'SDK 未发现 Link 2';
        document.getElementById('status').textContent = error.message;
      }
    }

    async function reconnectSdk() {
      try { await api('/api/reconnect', { method: 'POST' }); } catch (error) { notify(error.message, true); }
      await refreshStatus();
    }

    async function move(direction) {
      try {
        const speed = document.getElementById('speed').value;
        await api(`/api/gimbal/move?direction=${direction}&speed=${speed}`, { method: 'POST' });
      } catch (error) { notify(error.message, true); }
    }

    async function stopMovement() {
      try { await api('/api/gimbal/move?direction=stop', { method: 'POST', keepalive: true }); }
      catch (error) { notify(error.message, true); }
    }

    async function homeGimbal() {
      try { await api('/api/gimbal/home', { method: 'POST' }); await refreshStatus(); }
      catch (error) { notify(error.message, true); }
    }

    async function recoverDownwardPose() {
      const shouldReopenVideo = Boolean(stream);
      closeVideo();
      try {
        notify('正在切换普通模式，摄像头会短暂断开约 5 秒…');
        await api('/api/recover-downward-pose', { method: 'POST' });
        await refreshStatus();
        if (shouldReopenVideo) await openVideo();
      } catch (error) { notify(error.message, true); }
    }

    async function setTracking(enabled) {
      try { await api(`/api/tracking?enabled=${enabled}`, { method: 'POST' }); await refreshStatus(); }
      catch (error) { notify(error.message, true); }
    }

    async function setAutoFraming(enabled) {
      try {
        await api(`/api/auto-framing?enabled=${enabled}`, { method: 'POST' });
        if (!enabled) notify('普通模式会让 UVC 设备短暂重连；如画面中断，请重新打开画面');
        await refreshStatus();
      } catch (error) { notify(error.message, true); }
    }

    for (const button of document.querySelectorAll('[data-direction]')) {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        button.classList.add('active');
        move(button.dataset.direction);
      });
      const stop = () => { button.classList.remove('active'); stopMovement(); };
      button.addEventListener('pointerup', stop);
      button.addEventListener('pointercancel', stop);
      button.addEventListener('lostpointercapture', () => button.classList.remove('active'));
    }

    const keyDirections = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    const heldKeys = new Set();
    window.addEventListener('keydown', event => {
      const direction = keyDirections[event.key];
      if (!direction || heldKeys.has(event.key)) return;
      event.preventDefault();
      heldKeys.add(event.key);
      move(direction);
    });
    window.addEventListener('keyup', event => {
      if (!heldKeys.delete(event.key)) return;
      event.preventDefault();
      stopMovement();
    });
    window.addEventListener('blur', stopMovement);
    window.addEventListener('pagehide', stopMovement);

    const speed = document.getElementById('speed');
    speed.addEventListener('input', () => document.getElementById('speedValue').textContent = speed.value);
    navigator.mediaDevices?.addEventListener('devicechange', loadCameras);
    loadCameras().catch(() => {});
    refreshStatus();
    // SDK status queries are expensive. Poll slowly and never while the tab is
    // hidden; commands refresh the status explicitly after they finish.
    setInterval(() => {
      if (!document.hidden) refreshStatus();
    }, 30000);
  </script>
</body>
</html>
